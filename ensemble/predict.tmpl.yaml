---
ensemble:
  vars:
    arg_dataset:        DATASET
    arg_filter_factor:  1
    arg_network:        NETWORK
    arg_testset:        true
    cluster:      pvc
    email:        someone@example.com
    length:       00:30:00
    mem:          224gb
    nodes:        1
    ntasks:       8
    symlinks:
      - ../../../ENVS*
      - ../../../*.json
      - ../../../{configurations,network_datasets,processed,results}

  pre_process:          []
  post_process:         []

  batch_config:
    templatedir:  ../template
    templates:
    - icenet_predict.sh.j2
    job_file:     icenet_predict.sh
    maxruns:      MAXJOBS
    maxjobs:      MAXJOBS

  batches:
    - name:       NAME
      basedir:    ./ensemble/NAME
      pre_batch:
        - name:   execute
          args:
              cmd:  ln -s ../../data
        - name:   execute
          args:
              cmd:  ln -s ../../processed
        - name:   execute
          args:
              cmd:  ln -s ../../data.DATASET.json
      pre_run:    []
      runs:
        - seed:   SEEDS
      post_run:   []
      post_batch:
        - name:   execute
          args:
              cmd:  icenet_output -p -m --nan -r ../.. -o ../../results/predict NAME DATASET predict_dates.csv

